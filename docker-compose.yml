# OurSpots auf dem Server.
#
# Die Images baut die Pipeline und legt sie in registry.kirkanos.net ab; hier
# werden sie nur noch geholt. Auf dem Server liegen deshalb genau zwei Dateien:
# diese und die .env. Gestartet wird über die systemd-Unit aus template.service.
#
# Veröffentlicht wird nichts direkt – den Zugang regelt Traefik.
# Zum lokalen Bauen aus dem Quelltext: docker-compose.local.yml

name: ${SERVICE:-ourspots}

networks:
  # Alle Container hängen im gemeinsamen Netz, damit der Monitoring-Stack sie
  # erreicht. Geroutet wird trotzdem nur der Webcontainer – die anderen beiden
  # tragen traefik.enable=false.
  #
  # In einem geteilten Netz sind Dienstnamen wie "api" oder "db" nicht mehr
  # eindeutig: Compose vergibt den Dienstnamen automatisch als Netz-Alias, und
  # ein zweites Projekt mit einem Dienst "db" waere unter demselben Namen
  # erreichbar. Deshalb heissen die Dienste hier selbst schon eindeutig - ein
  # zusaetzlicher Alias haette den automatischen nicht ersetzt, sondern nur
  # ergaenzt.
  traefik-network:
    external: true

services:
  ourspots-db:
    image: mariadb:11
    container_name: ${SERVICE}-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - traefik-network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ourspots-api:
    # IMAGE_TAG schreibt die Pipeline beim Ausrollen in die .env – der Server
    # läuft damit auf genau dem Commit, der gerade gebaut wurde.
    image: registry.kirkanos.net/images/ourspots-api:${IMAGE_TAG:-latest}
    container_name: ${SERVICE}-api
    restart: unless-stopped
    depends_on:
      ourspots-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL}
      # Bewusst hier zusammengesetzt statt aus der .env übernommen: der Host
      # muss der eindeutige Alias sein, nicht der Dienstname "db".
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@ourspots-db:3306/${MYSQL_DATABASE}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_SCOPES: ${OIDC_SCOPES}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS}
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_BASE_URL: ${ORS_BASE_URL}
      NOMINATIM_URL: ${NOMINATIM_URL}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT}
      PHOTO_DIR: /data/photos
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - photo_data:/data/photos
    networks:
      - traefik-network
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  ourspots-web:
    image: registry.kirkanos.net/images/ourspots-web:${IMAGE_TAG:-latest}
    container_name: ${SERVICE}
    restart: unless-stopped
    depends_on:
      - ourspots-api
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE}.entrypoints=http"
      - "traefik.http.routers.${SERVICE}.rule=Host(`${HOST}`)"
      - "traefik.http.middlewares.${SERVICE}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${SERVICE}.middlewares=${SERVICE}-https-redirect"
      - "traefik.http.routers.${SERVICE}-secure.entrypoints=https"
      - "traefik.http.routers.${SERVICE}-secure.rule=Host(`${HOST}`)"
      - "traefik.http.routers.${SERVICE}-secure.tls=true"
      - "traefik.http.routers.${SERVICE}-secure.tls.certresolver=default"
      - "traefik.http.routers.${SERVICE}-secure.service=${SERVICE}"
      - "traefik.http.services.${SERVICE}.loadbalancer.server.port=${PORT}"
      - "traefik.docker.network=traefik-network"

volumes:
  db_data:
  photo_data:
