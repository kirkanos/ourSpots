# OurSpots auf dem Server.
#
# Die Images baut die Pipeline und legt sie in registry.kirkanos.net ab; hier
# werden sie nur noch geholt. Auf dem Server liegen deshalb genau zwei Dateien:
# diese und die .env. Gestartet wird über die systemd-Unit aus template.service.
#
# Veröffentlicht wird nichts direkt – den Zugang regelt Traefik.
# Zum lokalen Bauen aus dem Quelltext: docker-compose.local.yml

name: ${SERVICE:-ourspots}

networks:
  # Alle Container hängen im gemeinsamen Netz, damit der Monitoring-Stack sie
  # erreicht. Geroutet wird trotzdem nur der Webcontainer – die anderen beiden
  # tragen traefik.enable=false.
  #
  # In einem geteilten Netz sind Dienstnamen wie "api" oder "db" nicht mehr
  # eindeutig: Compose vergibt den Dienstnamen automatisch als Netz-Alias, und
  # ein zweites Projekt mit einem Dienst "db" waere unter demselben Namen
  # erreichbar. Deshalb heissen die Dienste hier selbst schon eindeutig - ein
  # zusaetzlicher Alias haette den automatischen nicht ersetzt, sondern nur
  # ergaenzt.
  traefik-network:
    external: true

services:
  ourspots-db:
    image: mariadb:13
    container_name: ${SERVICE}-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Nach einem Sprung auf eine neue Hauptversion muessen die Systemtabellen
      # angepasst werden. Ohne diesen Schalter ueberspringt der Einstiegspunkt
      # den Schritt und meldet ihn nur im Log -- der Server laeuft dann mit dem
      # Datenverzeichnis der alten Fassung weiter, was MariaDB nicht vorsieht.
      MARIADB_AUTO_UPGRADE: 1
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - traefik-network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ourspots-api:
    # IMAGE_TAG schreibt die Pipeline beim Ausrollen in die .env – der Server
    # läuft damit auf genau dem Commit, der gerade gebaut wurde.
    image: registry.kirkanos.net/images/ourspots-api:${IMAGE_TAG:-latest}
    container_name: ${SERVICE}-api
    restart: unless-stopped
    depends_on:
      ourspots-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL}
      # Bewusst hier zusammengesetzt statt aus der .env übernommen: der Host
      # muss der eindeutige Alias sein, nicht der Dienstname "db".
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@ourspots-db:3306/${MYSQL_DATABASE}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_SCOPES: ${OIDC_SCOPES}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS}
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_BASE_URL: ${ORS_BASE_URL}
      NOMINATIM_URL: ${NOMINATIM_URL}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      PHOTO_DIR: /data/photos
      # Die API gibt Renderauftraege beim Videocontainer auf und liest die
      # fertigen Dateien aus demselben Volume.
      VIDEO_RENDERER_URL: http://ourspots-video:3100
      VIDEO_DIR: /data/videos
      VIDEO_WEB_URL: http://ourspots-web:${PORT}
      VIDEO_RENDER_TOKEN: ${VIDEO_RENDER_TOKEN}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - photo_data:/data/photos
      - video_data:/data/videos
    networks:
      - traefik-network
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Rendert Reisevideos: ein Chromium fotografiert die Renderseite der
  # Oberflaeche Bild fuer Bild, ffmpeg macht ein MP4 daraus. Bewusst ein
  # eigener Container -- ein Browser mit Kartenkacheln und Gelaendemodell hat
  # im API-Container nichts verloren, und so laesst sich der Speicherhunger
  # getrennt deckeln.
  ourspots-video:
    image: registry.kirkanos.net/images/ourspots-video:${IMAGE_TAG:-latest}
    container_name: ${SERVICE}-video
    restart: unless-stopped
    depends_on:
      - ourspots-web
    environment:
      PORT: 3100
      # Die Renderseite kommt vom Webcontainer, nicht von der API.
      WEB_URL: http://ourspots-web:${PORT}
      VIDEO_DIR: /data/videos
      VIDEO_RENDER_TOKEN: ${VIDEO_RENDER_TOKEN}
    volumes:
      - video_data:/data/videos
    networks:
      - traefik-network
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    # Chromium mit Gelaendemodell ist der groesste Speicherfresser im Stack.
    # Gemessen auf einer 392-km-Reise: gut 1,2 GB bei 720p und 1080p, 2,7 GB
    # bei 4K. Der Bedarf waechst mit der Laenge der Route, weil Chromium die
    # Kacheln der ganzen Strecke vorhaelt -- bei doppelter Pixeldichte vier Mal
    # so viele.
    #
    # Die Grenze ist kein Budget, sondern eine Notbremse: Belegt wird nur, was
    # der Lauf braucht, und nur waehrend er laeuft. Laeuft etwas aus dem Ruder,
    # trifft es den Browser in diesem Container und nicht Datenbank oder API.
    #
    # Dieser Wert ist bewusst grosszuegig gewaehlt und wird im Normalbetrieb
    # nie erreicht. Zu beachten: Je naeher die Grenze an den freien
    # Arbeitsspeicher des Servers rueckt, desto weniger schuetzt sie -- dann
    # ist der Speicher schon knapp, bevor der Container seine Grenze sieht,
    # und der Kernel sucht sich sein Opfer selbst aus.
    mem_limit: 10g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ourspots-web:
    image: registry.kirkanos.net/images/ourspots-web:${IMAGE_TAG:-latest}
    container_name: ${SERVICE}
    restart: unless-stopped
    depends_on:
      - ourspots-api
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE}.entrypoints=http"
      - "traefik.http.routers.${SERVICE}.rule=Host(`${HOST}`)"
      - "traefik.http.middlewares.${SERVICE}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${SERVICE}.middlewares=${SERVICE}-https-redirect"
      - "traefik.http.routers.${SERVICE}-secure.entrypoints=https"
      - "traefik.http.routers.${SERVICE}-secure.rule=Host(`${HOST}`)"
      - "traefik.http.routers.${SERVICE}-secure.tls=true"
      - "traefik.http.routers.${SERVICE}-secure.tls.certresolver=default"
      - "traefik.http.routers.${SERVICE}-secure.service=${SERVICE}"
      - "traefik.http.services.${SERVICE}.loadbalancer.server.port=${PORT}"
      - "traefik.docker.network=traefik-network"

volumes:
  db_data:
  photo_data:
  # Bewusst ein eigenes Volume: Videos sind jederzeit neu erzeugbar und mit
  # Hunderten Megabyte das Groesste, was hier liegt. Die naechtliche Sicherung
  # laesst sie deshalb aus, siehe scripts/backup.sh.
  video_data:
