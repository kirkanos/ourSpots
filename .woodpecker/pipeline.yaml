labels:
  backend: docker

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 50
      lfs: false

when:
  - event: push
    branch: main

# Die Schritte laufen als Graph, nicht als Liste: Sobald irgendein Schritt ein
# depends_on traegt, wertet Woodpecker die Abhaengigkeiten aus und startet
# alles parallel, was parallel laufen darf. Deshalb braucht jeder Schritt
# hier eine ausdrueckliche Angabe -- ein Schritt ohne depends_on wuerde sofort
# losrennen, auch vor der Pruefung.
#
# Die drei Image-Builds haengen nur an "check" und laufen damit gleichzeitig.
# Gemessen nacheinander: 24 s (web), 65 s (api), 115 s (video). Parallel
# bestimmt der laengste die Dauer.
steps:
  - name: Decrypt .env File
    depends_on: []
    image: registry.kirkanos.net/images/ci-build:alpine
    pull: true
    environment:
      SOPS_AGE_KEY:
        from_secret: sops_age_key
    commands:
      - "sops --decrypt --input-type dotenv --output-type dotenv --output .env .env.enc"
    when:
      - event: push

  - name: check
    # Braucht die .env nicht -- kann sofort mitlaufen.
    depends_on: []
    image: node:26-bookworm-slim
    commands:
      # Typprüfung über beide Anwendungen und das gemeinsame Paket, dazu der
      # Produktionsbuild des Frontends – der fängt ab, was erst beim Bündeln
      # auffällt. Läuft vor dem Image-Build, damit eine kaputte Fassung gar
      # nicht erst in der Registry landet.
      # Ohne openssl rät Prisma die Engine-Variante und warnt bei jedem Lauf.
      # Im API-Image ist das Paket aus demselben Grund installiert.
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl
      - npm ci --no-audit --no-fund
      - npx prisma generate --config apps/api/prisma.config.ts
      - npm run build --workspace @ourspots/shared
      - npm run typecheck
      - npm run build --workspace @ourspots/web
      # Zeitachse und Kamerakurve der Reiseanimation sind reine Rechnerei; ob
      # sie stimmt, sieht man im fertigen Video gerade nicht. Siehe
      # apps/web/pruefungen/README.md.
      - npm run pruefe --workspace @ourspots/web
      # Der Renderer liegt ausserhalb der Workspaces und hat deshalb keine
      # Typpruefung. Eine Syntaxpruefung kostet nichts und faengt wenigstens
      # das ab, was sonst erst der laufende Container meldet.
      - node --check docker/video/server.mjs
    when:
      - event: push

  - name: build api image
    # Erst bauen, wenn Typen und Pruefungen stimmen -- sonst landet eine
    # kaputte Fassung in der Registry.
    depends_on: [check]
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: registry.kirkanos.net
      repo: images/ourspots-api
      dockerfile: docker/api/Dockerfile
      context: .
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      tags:
        - latest
        - "sha-${CI_COMMIT_SHA:0:7}"
    when:
      - event: push

  - name: build web image
    # Erst bauen, wenn Typen und Pruefungen stimmen -- sonst landet eine
    # kaputte Fassung in der Registry.
    depends_on: [check]
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: registry.kirkanos.net
      repo: images/ourspots-web
      dockerfile: docker/web/Dockerfile
      context: .
      # Keine build_args: Kaniko reicht sie als Kommandozeilenargumente weiter
      # und zerbricht an Werten mit Leerzeichen. Die Kartenquelle steht als
      # Vorgabe in apps/web/src/lib/env.ts und ist dort dieselbe.
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      tags:
        - latest
        - "sha-${CI_COMMIT_SHA:0:7}"
    when:
      - event: push

  - name: build video image
    # Erst bauen, wenn Typen und Pruefungen stimmen -- sonst landet eine
    # kaputte Fassung in der Registry.
    depends_on: [check]
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: registry.kirkanos.net
      repo: images/ourspots-video
      dockerfile: docker/video/Dockerfile
      context: .
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      tags:
        - latest
        - "sha-${CI_COMMIT_SHA:0:7}"
    when:
      - event: push

  - name: deploy files
    depends_on:
      - build api image
      - build web image
      - build video image
      - Decrypt .env File
    image: registry.kirkanos.net/images/ci-build:alpine
    volumes: [ "/services/common/.ssh:/root/.ssh" ]
    environment:
      SSH_HOST_LOCAL:
        from_secret: ssh_host_local
    commands:
      - set -a && . ./.env && set +a
      - test -n "$SERVICE" || (echo "SERVICE ist leer" && exit 1)
      - test -n "$HOST" || (echo "HOST ist leer" && exit 1)
      - test -n "$PORT" || (echo "PORT ist leer" && exit 1)
      - test -n "$SSH_HOST_LOCAL" || (echo "SSH_HOST_LOCAL ist leer" && exit 1)
      - echo "Deploy target host=$SSH_HOST_LOCAL service=$SERVICE"
      # Auf dem Server laufen die eben gebauten Images, festgenagelt auf diesen
      # Commit – "latest" wäre nicht nachvollziehbar und bei einem Neustart
      # womöglich schon eine andere Fassung.
      # Mit Praefix "sha-": Ein Kurz-Hash nur aus Ziffern mit fuehrender Null
      # (etwa 0269357) macht Kaniko zur Zahl 269357 und pusht unter diesem Tag -
      # der Server sucht dann vergeblich nach 0269357.
      - echo "IMAGE_TAG=sha-${CI_COMMIT_SHA:0:7}" >> .env
      - export SSH_OPTS='-o BatchMode=yes -o RequestTTY=no -o ConnectTimeout=30 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p822'
      - export SCP_OPTS='-o BatchMode=yes -o ConnectTimeout=30 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -P822'
      - timeout 60 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"mkdir -p /services/$SERVICE\""
      - echo "Upload docker-compose.yml, .env, backup.sh und verify-deploy.sh"
      - timeout 60 sh -c "scp $SCP_OPTS docker-compose.yml .env scripts/backup.sh scripts/verify-deploy.sh \"$SSH_HOST_LOCAL\":/services/$SERVICE/"
      # Die .env und das Backup-Archiv enthalten Zugangsdaten; nur der Besitzer
      # soll sie lesen koennen.
      - timeout 60 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"chmod 600 /services/$SERVICE/.env && chmod 700 /services/$SERVICE/backup.sh /services/$SERVICE/verify-deploy.sh\""
      - echo "Upload systemd units"
      - sed -e "s/%SERVICE%/$SERVICE/g" template.service > "$SERVICE.service"
      - sed -e "s/%SERVICE%/$SERVICE/g" template-backup.service > "$SERVICE-backup.service"
      - sed -e "s/%SERVICE%/$SERVICE/g" template-backup.timer > "$SERVICE-backup.timer"
      - timeout 60 sh -c "scp $SCP_OPTS \"$SERVICE.service\" \"$SERVICE-backup.service\" \"$SERVICE-backup.timer\" \"$SSH_HOST_LOCAL\":/etc/systemd/system"
      # Nur der Timer wird aktiviert – die Sicherung selbst startet er.
      - timeout 60 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"systemctl daemon-reload && systemctl enable $SERVICE && systemctl enable --now $SERVICE-backup.timer\""
    when:
      - event: push

  - name: restart service
    depends_on: [deploy files]
    image: registry.kirkanos.net/images/ci-build:alpine
    volumes: [ "/services/common/.ssh:/root/.ssh" ]
    environment:
      SSH_HOST_LOCAL:
        from_secret: ssh_host_local
    commands:
      - set -a && . ./.env && set +a
      - test -n "$SERVICE" || (echo "SERVICE ist leer" && exit 1)
      - test -n "$SSH_HOST_LOCAL" || (echo "SSH_HOST_LOCAL ist leer" && exit 1)
      - export SSH_OPTS='-o BatchMode=yes -o RequestTTY=no -o ConnectTimeout=30 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p822'
      - timeout 60 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"systemctl stop $SERVICE\" || true"
      - timeout 180 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"systemctl start $SERVICE\""
      - echo "Service restart done"
    when:
      - event: push

  # systemctl start kehrt zurueck, sobald der Startbefehl abgesetzt ist -- nicht,
  # wenn die Anwendung antwortet. Ohne diesen Schritt meldet die Pipeline Erfolg,
  # waehrend die App nicht hochkommt. Genau so ist der Sprung auf mariadb:13
  # unbemerkt durchgegangen.
  - name: verify deploy
    depends_on: [restart service]
    image: registry.kirkanos.net/images/ci-build:alpine
    volumes: [ "/services/common/.ssh:/root/.ssh" ]
    environment:
      SSH_HOST_LOCAL:
        from_secret: ssh_host_local
    commands:
      - set -a && . ./.env && set +a
      - test -n "$SERVICE" || (echo "SERVICE ist leer" && exit 1)
      - test -n "$SSH_HOST_LOCAL" || (echo "SSH_HOST_LOCAL ist leer" && exit 1)
      - export SSH_OPTS='-o BatchMode=yes -o RequestTTY=no -o ConnectTimeout=30 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p822'
      # Grosszuegiger als das Zeitlimit im Skript, damit dessen Bericht noch
      # durchkommt, statt von timeout abgeschnitten zu werden.
      - timeout 300 sh -c "ssh -n -T $SSH_OPTS \"$SSH_HOST_LOCAL\" \"/services/$SERVICE/verify-deploy.sh\""
    when:
      - event: push
